services:
  countup:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: change-me      # <- pick your password
      DB_FILE: /data/countup.db
    volumes:
      - ./data:/data                 # the database file ends up in ./data on your server
    ports:
      - "127.0.0.1:3000:3000"        # only reachable from the server itself; Caddy handles the outside
