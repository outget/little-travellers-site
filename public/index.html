<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Count-up</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <a class="admin-link" href="/admin">Admin</a>
        <h1>Count-up</h1>
        <table id="list"></table>

        <script src="shared.js"></script>
        <script>
            let timers = [];

            // Get the latest list from the server and rebuild the table
            async function load() {
                const res = await fetch("/api/timers");
                timers = await res.json();

                document.getElementById("list").innerHTML = timers
                    .map(
                        (t) => `
        <tr class="${t.paused_at ? "paused" : ""}">
          <td>
            ${esc(t.name)}
            ${messageHtml(t)}
          </td>
          <td>${esc(t.location)}</td>
          <td class="time" id="time-${t.id}">${elapsed(t)}</td>
        </tr>
      `,
                    )
                    .join("");
            }

            load();
            setInterval(load, 15000); // check for admin changes every 15 seconds
            setInterval(() => tick(timers), 1000); // update the clocks every second
        </script>
    </body>
</html>
