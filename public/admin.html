<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>admin</title>
        <link rel="icon" type="image/png" href="site-icon.png" />
        <link rel="apple-touch-icon" href="site-icon.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>admin</h1>

        <form id="login">
            <input id="password" type="password" placeholder="Password" />
            <button>log in</button>
        </form>

        <div id="panel" hidden>
            <form id="add">
                <input id="name" placeholder="Name" required />
                <input id="location" placeholder="Location" />
                <input
                    id="date"
                    type="datetime-local"
                    title="Count up from (leave empty for now)"
                />
                <button>Add</button>
            </form>
            <div id="list" class="grid"></div>

            <div class="card board-card">
                <h2>message board</h2>
                <div class="board-list" id="board-list"></div>
            </div>
            <div class="card board-card">
                <h2>diaries</h2>
                <p class="note" id="disk-use"></p>
                <div class="board-list" id="poster-list"></div>
                <form id="add-poster" class="poster-form">
                    <input id="poster-username" placeholder="username" required />
                    <input id="poster-password" type="password" placeholder="password (8+ characters)" required />
                    <button>add diary</button>
                </form>
                <p class="board-error" id="poster-error"></p>
            </div>
            <p><a href="/">View public page</a></p>
        </div>

        <script src="shared.js"></script>
        <script>
            let password = localStorage.getItem("password"); // remembered after the first login
            let timers = [];

            // Every admin request goes through here: it sends the password,
            // and the server answers with the updated list of timers.
            async function api(method, path, body) {
                const res = await fetch("/api/admin/timers" + path, {
                    method,
                    headers: {
                        "Content-Type": "application/json",
                        "X-Password": password,
                    },
                    body: JSON.stringify(body),
                });

                if (res.status === 401) {
                    localStorage.removeItem("password");
                    document.getElementById("password").value = "";
                    document.getElementById("password").placeholder =
                        "Wrong password, try again";
                    document.getElementById("login").hidden = false;
                    document.getElementById("panel").hidden = true;
                    return;
                }

                localStorage.setItem("password", password);
                document.getElementById("login").hidden = true;
                document.getElementById("panel").hidden = false;
                timers = await res.json();
                draw();
                loadMessages();
                loadPosters();
            }

            // ---------- message board ----------

            async function loadMessages() {
                const res = await fetch("/api/messages");
                drawMessages((await res.json()).messages);
            }

            function drawMessages(messages) {
                document.getElementById("board-list").innerHTML =
                    messages
                        .map(
                            (m) => `
                <div class="board-msg">
                  <div class="board-meta"><b>${esc(m.name)}</b> · ${new Date(m.created_at).toLocaleString()}</div>
                  <div class="board-text">${esc(m.text)}</div>
                  <button class="danger" onclick="removeMessage(${m.id})">Delete</button>
                </div>`,
                        )
                        .join("") || `<p class="board-empty">no messages</p>`;
            }

            // ---------- diaries ----------

            // Admin requests that aren't about timers (the api() helper above is for those)
            function adminFetch(method, path, body) {
                return fetch("/api/admin/" + path, {
                    method,
                    headers: { "Content-Type": "application/json", "X-Password": password },
                    body: JSON.stringify(body),
                });
            }

            async function loadPosters() {
                const res = await adminFetch("GET", "posters");
                if (!res.ok) return;
                const { posters, imageBytes, freeBytes } = await res.json();
                document.getElementById("disk-use").textContent =
                    `photos use ${(imageBytes / 1e6).toFixed(1)} MB · ${(freeBytes / 1e9).toFixed(1)} GB free on the server`;
                document.getElementById("poster-list").innerHTML =
                    posters
                        .map(
                            (p) => `
                <div class="board-msg">
                  <div class="board-meta"><b>${esc(p.username)}</b> · ${p.posts} posts ·
                    <a href="/diary/${encodeURIComponent(p.username)}">open diary</a></div>
                  <button onclick="setPosterPassword(${p.id})">New password</button>
                  <button class="danger" onclick="removePoster(${p.id})">Delete</button>
                </div>`,
                        )
                        .join("") || `<p class="board-empty">no diaries yet</p>`;
            }

            async function posterResult(res) {
                const data = await res.json();
                document.getElementById("poster-error").textContent = res.ok ? "" : data.error;
                if (res.ok) loadPosters();
                return res.ok;
            }

            function setPosterPassword(id) {
                const newPassword = prompt("New password (8+ characters):");
                if (newPassword)
                    adminFetch("POST", `posters/${id}/password`, { password: newPassword }).then(posterResult);
            }

            function removePoster(id) {
                if (confirm("Delete this person and their whole diary, with all photos and comments?"))
                    adminFetch("DELETE", "posters/" + id).then(posterResult);
            }

            document.getElementById("add-poster").onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById("poster-username");
                const posterPassword = document.getElementById("poster-password");
                const ok = await posterResult(
                    await adminFetch("POST", "posters", {
                        username: username.value,
                        password: posterPassword.value,
                    }),
                );
                if (ok) username.value = posterPassword.value = "";
            };

            async function removeMessage(id) {
                if (!confirm("Delete this message?")) return;
                const res = await fetch("/api/admin/messages/" + id, {
                    method: "DELETE",
                    headers: { "X-Password": password },
                });
                if (res.ok) drawMessages((await res.json()).messages);
            }

            function draw() {
                document.getElementById("list").innerHTML = timers
                    .map(
                        (t) => `
                <div class="card ${t.paused_at ? "paused" : ""}">
                  <h2>${esc(t.name)}</h2>
                  ${t.location ? `<div class="since">📍 ${esc(t.location)}</div>` : ""}
                  <div class="since">since ${new Date(t.started_at).toLocaleString()}</div>
                  <div class="time" id="time-${t.id}">${elapsed(t)}</div>
                  ${messageHtml(t)}
                  <div class="actions">
                    ${
                        t.paused_at
                            ? `<button onclick="resume(${t.id})">Resume</button>`
                            : `<button onclick="pause(${t.id})">Pause</button>`
                    }
                    <button onclick="reset(${t.id})">Reset</button>
                    <button onclick="message(${t.id})">Message</button>
                    <button onclick="setDate(${t.id})">Date</button>
                    <button onclick="rename(${t.id})">Rename</button>
                    <button onclick="setLocation(${t.id})">Location</button>
                    <button class="danger" onclick="remove(${t.id})">Delete</button>
                  </div>
                </div>
              `,
                    )
                    .join("");
            }

            // ---------- button actions ----------

            function reset(id) {
                if (confirm("Reset to zero, starting now?"))
                    api("POST", `/${id}/reset`);
            }

            function pause(id) {
                api("POST", `/${id}/pause`);
            }

            function message(id) {
                const current = timers.find((t) => t.id === id).message || "";
                const text = prompt(
                    "Message (leave empty to remove):",
                    current,
                );
                if (text !== null)
                    api("POST", `/${id}/message`, { message: text });
            }

            function setDate(id) {
                const text = prompt(
                    "Count up from (e.g. 2025-03-14 or 2025-03-14 18:30):",
                );
                if (!text) return;
                const started_at = parseDate(text);
                if (isNaN(started_at))
                    return alert(
                        "Couldn't read that date. Use the format 2025-03-14 18:30",
                    );
                api("POST", `/${id}/start`, { started_at });
            }

            // Turns "2025-03-14" or "2025-03-14 18:30" into a timestamp, in your local time.
            // (A bare "2025-03-14" would otherwise be read as midnight UTC, so we add the time ourselves.)
            function parseDate(text) {
                text = text.trim().replace(" ", "T");
                if (text.length === 10) text += "T00:00";
                return new Date(text).getTime();
            }

            function resume(id) {
                api("POST", `/${id}/resume`);
            }

            function rename(id) {
                const name = prompt("New name:");
                if (name) api("PATCH", `/${id}`, { name });
            }

            function setLocation(id) {
                const current = timers.find((t) => t.id === id).location || "";
                const location = prompt(
                    "Location (leave empty to remove):",
                    current,
                );
                if (location !== null)
                    api("POST", `/${id}/location`, { location });
            }

            function remove(id) {
                if (confirm("Delete this one?")) api("DELETE", `/${id}`);
            }

            // ---------- forms ----------

            document.getElementById("login").onsubmit = (e) => {
                e.preventDefault(); // stop the browser reloading the page
                password = document.getElementById("password").value;
                api("GET", "");
            };

            document.getElementById("add").onsubmit = (e) => {
                e.preventDefault();
                const name = document.getElementById("name");
                const date = document.getElementById("date");
                const location = document.getElementById("location");
                api("POST", "", {
                    name: name.value,
                    location: location.value,
                    started_at: date.value
                        ? new Date(date.value).getTime()
                        : undefined, // empty = start now
                });
                name.value = "";
                location.value = "";
                date.value = "";
            };

            if (password) api("GET", ""); // already logged in before? go straight to the panel
            setInterval(() => tick(timers), 1000);
        </script>
    </body>
</html>
